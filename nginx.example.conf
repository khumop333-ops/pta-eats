# Nginx server block example for roma.africa
# Place this in /etc/nginx/sites-available/roma.africa and symlink to sites-enabled,
# then run `sudo nginx -t && sudo systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name roma.africa www.roma.africa;
    # Redirect HTTP to HTTPS (once SSL is set up with Certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name roma.africa www.roma.africa;

    # Paths shown are typical for Certbot. Update to match your system.
    ssl_certificate     /etc/letsencrypt/live/roma.africa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roma.africa/privkey.pem;

    root /var/www/roma.africa/dist;
    index index.html;

    # Long-cache hashed Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
