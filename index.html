    <!-- PWA. The manifest and icons live in /public and are served as static
         files by any host, so this works unchanged under Vite today and under

         the iOS Safari toolbar so the app does not show a white band above a
         dark green interface. -->

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ROMA" />
